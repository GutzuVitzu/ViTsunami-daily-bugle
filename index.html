<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f1e8"><title>Daily Bugle — персональная газета</title><meta name="description" content="Архив персональной газеты Daily Bugle"><style>
:root{--paper:#f5f1e8;--ink:#1d2425;--muted:#69716e;--accent:#9c3427;--line:#d9d3c7}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}button,input{font:inherit}a{color:inherit}header{border-bottom:4px double var(--ink);padding:20px 20px 14px;text-align:center}.eyebrow{font:700 10px/1.5 Arial,sans-serif;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent)}.masthead{font-size:clamp(42px,10vw,100px);letter-spacing:-.075em;line-height:1;margin:10px 0 6px;font-weight:900}.strap{font-size:14px;font-style:italic}.datebar{border-top:1px solid var(--line);margin-top:15px;padding-top:10px;display:flex;justify-content:space-between;gap:12px;font:11px Arial,sans-serif;letter-spacing:.5px}.layout{max-width:1160px;margin:auto;display:grid;grid-template-columns:255px minmax(0,1fr);gap:38px;padding:26px 25px 80px}aside{border-right:1px solid var(--line);padding-right:22px;align-self:start;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}h2.sidehead{font:700 11px Arial,sans-serif;letter-spacing:1.8px;text-transform:uppercase;color:var(--accent);margin:5px 0 14px}.issue{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:13px 8px;cursor:pointer}.issue:hover,.issue.active{background:#e9e2d4}.issue strong{display:block;font-size:17px}.issue span{display:block;font:12px Arial,sans-serif;color:var(--muted);margin-top:5px}.jump{margin-top:28px}.jump a{display:block;text-decoration:none;font:13px Arial,sans-serif;padding:9px 4px;border-bottom:1px solid var(--line)}.jump a:hover{color:var(--accent)}.content{min-width:0}.issue-meta{font:700 11px Arial,sans-serif;letter-spacing:1.8px;color:var(--accent);text-transform:uppercase}.issue-title{font-size:clamp(32px,5vw,59px);line-height:1.05;letter-spacing:-1.5px;margin:12px 0 18px}.intro{font-size:20px;line-height:1.5;color:#404946;max-width:780px}.story{border-top:2px solid var(--ink);padding-top:22px;margin-top:38px;scroll-margin-top:20px}.story .section{font:700 11px Arial,sans-serif;letter-spacing:1.8px;color:var(--accent);text-transform:uppercase}.story h2{font-size:clamp(26px,3.5vw,39px);line-height:1.13;letter-spacing:-.5px;margin:13px 0 16px}.story p{font-size:18px;line-height:1.7;max-width:750px}.story p.lead{font-size:21px;line-height:1.5}.source{font:12px/1.7 Arial,sans-serif;color:var(--muted);margin-top:15px}.source a{color:var(--accent)}.notice{font:13px/1.6 Arial,sans-serif;color:#5d615c;border-left:3px solid var(--accent);padding:12px 15px;background:#eee8dd;margin-top:25px}.toplink{font:12px Arial,sans-serif;color:var(--accent);text-decoration:none}.mobilebar{display:none}.footer{border-top:4px double var(--ink);margin-top:40px;padding:20px 0;font:12px/1.6 Arial,sans-serif;color:var(--muted)}@media(max-width:750px){.layout{display:block;padding:16px 18px 70px}aside{position:static;border:0;padding:0;max-height:none;overflow:visible}.archive{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.issue{flex:0 0 130px;border:1px solid var(--line);padding:10px}.issue strong{font-size:15px}.jump{margin:13px 0 22px;display:flex;gap:8px;overflow-x:auto}.jump a{flex:0 0 auto;border:1px solid var(--line);padding:9px;border-radius:20px}.masthead{letter-spacing:-.06em}.story p{font-size:17px}.datebar{font-size:10px}.issue-title{margin-top:9px}.intro{font-size:18px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><header id="top"><div class="eyebrow">Независимое любопытство · Варшава</div><div class="masthead">DAILY BUGLE</div><div class="strap">Истории, которые стоят твоего времени</div><div class="datebar"><span>ПЕРСОНАЛЬНОЕ ИЗДАНИЕ</span><span>БИЗНЕС · НАУКА · СПОРТ · КУЛЬТУРА</span></div></header><div class="layout"><aside><h2 class="sidehead">Архив выпусков</h2><nav class="archive" id="archive" aria-label="Архив выпусков"></nav><h2 class="sidehead jump">В этом номере</h2><nav class="jump" id="jump" aria-label="Разделы выпуска"></nav></aside><main class="content" id="reader" tabindex="-1"></main></div><script src="issues.js"></script><script>
const archive=document.querySelector('#archive'),jump=document.querySelector('#jump'),reader=document.querySelector('#reader');const labels={business:'Бизнес и экономика',science:'Наука и технологии',sport:'Спорт и аналитика',culture:'Культура и история'};function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(id){let issue=ISSUES.find(i=>i.id===id)||ISSUES[0];archive.innerHTML=ISSUES.map(i=>`<button class="issue ${i.id===issue.id?'active':''}" data-id="${i.id}" aria-pressed="${i.id===issue.id}"><strong>${safe(i.date)}</strong><span>№ ${i.number} · ${safe(i.tag)}</span></button>`).join('');jump.innerHTML=issue.stories.map((s,n)=>`<a href="#${s.category}">${safe(labels[s.category])}</a>`).join('');reader.innerHTML=`<div class="issue-meta">№ ${issue.number} / ${safe(issue.date)} / ${safe(issue.minutes)}</div><h1 class="issue-title">${safe(issue.headline)}</h1><p class="intro">${safe(issue.intro)}</p>${issue.stories.map(s=>`<article class="story" id="${s.category}"><div class="section">${safe(labels[s.category])}</div><h2>${safe(s.title)}</h2>${s.paragraphs.map((p,n)=>`<p class="${n===0?'lead':''}">${safe(p)}</p>`).join('')}${s.sources?.length?`<div class="source">Источники: ${s.sources.map(x=>`<a href="${safe(x.url)}" target="_blank" rel="noopener noreferrer">${safe(x.label)}</a>`).join(' · ')}</div>`:''}<p><a class="toplink" href="#top">↑ К началу номера</a></p></article>`).join('')}<div class="notice">Архивная веб-редакция: материалы адаптированы из ранее подготовленных выпусков ChatGPT и сокращены для первого прототипа. Это не дословные полные версии. Часть утверждений в исходных выпусках не проходила независимую проверку; ссылки ведут на открытые тематические источники, а не подтверждают автоматически каждое утверждение. Перед публичным распространением нужна фактологическая редактура.</div><div class="footer">DAILY BUGLE · Статический архив · Не обновляется автоматически. Новые выпуски добавляются в issues.js.</div>`;document.title=`Daily Bugle №${issue.number} — ${issue.date}`;history.replaceState(null,'','#issue='+issue.id);window.scrollTo({top:0,behavior:'instant'});}archive.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)show(b.dataset.id)});window.addEventListener('hashchange',()=>{const h=location.hash.match(/^#issue=(.+)$/);if(h)show(h[1])});show((location.hash.match(/^#issue=(.+)$/)||[])[1]||ISSUES[0].id);
</script></body></html>
